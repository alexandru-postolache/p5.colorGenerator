<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.ColorGenerator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="../p5.colorGenerator.js"></script>
</head>
<body>
    <div id="waves-container"></div>
    <div class="container">
        <header class="page-head">
            <div>
                <h1>p5.ColorGenerator</h1>
                <p class="lede">One base color, a set of palettes, and those shades painted as waves behind the page.</p>
            </div>
            <a class="source-link" href="https://github.com/alexandru-postolache/p5.colorGenerator" target="_blank" rel="noreferrer">
                <i class="fab fa-github" aria-hidden="true"></i>
                Source
            </a>
        </header>

        <section class="studio" aria-label="Palette controls">
            <div class="base-card">
                <label class="swatch-input" for="colorPicker">
                    <span class="field-label">Base color</span>
                    <input type="color" id="colorPicker" value="#e39b14" aria-label="Base color">
                </label>
                <p id="baseReadout" class="base-readout">#e39b14</p>
                <button id="randomColor" class="control-button" type="button">Random color</button>
                <div class="seed-row">
                    <label class="field-label" for="colorSeed">Seed</label>
                    <input id="colorSeed" type="number" min="0" step="1" inputmode="numeric" aria-label="Random seed">
                    <button id="applySeed" class="control-button" type="button">Apply</button>
                </div>
                <label class="mix-well" for="mixColor">
                    <span class="field-label">Mix with</span>
                    <input type="color" id="mixColor" value="#3366cc" aria-label="Color to mix with">
                </label>
            </div>

            <div class="control-grid">
                <div class="field">
                    <span class="field-label" id="formatLabel">Format</span>
                    <div id="colorFormat" class="segmented" role="group" aria-labelledby="formatLabel">
                        <button type="button" data-value="hex" class="is-selected" aria-pressed="true">HEX</button>
                        <button type="button" data-value="rgb" aria-pressed="false">RGB</button>
                        <button type="button" data-value="hsb" aria-pressed="false">HSB</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label" id="spaceLabel">Space</span>
                    <div id="colorSpace" class="segmented" role="group" aria-labelledby="spaceLabel">
                        <button type="button" data-value="hsb" class="is-selected" aria-pressed="true">HSB</button>
                        <button type="button" data-value="oklch" aria-pressed="false">OKLCH</button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="swatchCount">Colors</label>
                    <div class="stepper">
                        <button id="countDown" type="button" aria-label="Fewer colors">−</button>
                        <input id="swatchCount" type="number" min="2" max="8" value="5">
                        <button id="countUp" type="button" aria-label="More colors">+</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label">Ramp</span>
                    <label class="switch" for="includeBase">
                        <input id="includeBase" type="checkbox" checked>
                        <span class="switch-track" aria-hidden="true"></span>
                        Include base
                    </label>
                </div>

                <div class="field">
                    <label class="field-label" for="harmonyDegree">Harmony <span id="degreeReadout">30°</span></label>
                    <input id="harmonyDegree" type="range" min="5" max="90" value="30">
                </div>
                <div class="field">
                    <label class="field-label" for="rectangleAngle">Rectangle <span id="angleReadout">60°</span></label>
                    <input id="rectangleAngle" type="range" min="15" max="90" value="60">
                </div>
            </div>
        </section>

        <h2 class="section-title">Palettes</h2>
        <div class="schemes">
            <div class="scheme">
                <div id="complementary" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="triadic" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="analogous" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="splitComplementary" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="tetradic" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="rectangle" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="even" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="monochromatic" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="shades" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="tints" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="tones" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="roles" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="vision" class="color-display"></div>
            </div>
            <div class="scheme">
                <div id="mix" class="color-display"></div>
            </div>
            <div class="scheme scheme-wide">
                <div id="contrast"></div>
            </div>
            <div class="scheme">
                <div id="image"></div>
                <label class="file-label" for="imageFile">Sample an image
                    <input id="imageFile" type="file" accept="image/*">
                </label>
            </div>
        </div>

        <footer>
            <p>Made with ❤️ in Amsterdam by
                <a href="https://alexcodesart.com">
                    <img src="logo.png" alt="Alex Codes Art" width="150">
                </a>
            </p>
        </footer>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
